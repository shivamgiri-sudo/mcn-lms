name: Refresh Multer Lockfile

on:
  push:
    branches:
      - agent/lms-security-assurance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-multer-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and commit npm-approved Multer lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/lms-security-assurance
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate and validate package manifest and lockfile
        working-directory: backend
        run: |
          npm install --package-lock-only --save-exact multer@2.2.0
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          node -e "const p=require('./package.json'); if(p.dependencies.multer!=='2.2.0') process.exit(1)"
      - name: Commit generated files and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json
          git rm .github/workflows/refresh-multer-lock.yml
          if git diff --cached --quiet; then
            echo 'No generated package changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Upgrade Multer to 2.2.0'
          git push origin HEAD:agent/lms-security-assurance
