name: LMS Phase 7 Audit Diagnostics

on:
  pull_request:
    branches: [agent/lms-practical-assessments]
  push:
    branches: [agent/lms-evaluator-calibration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lms-phase7-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: Generate backend audit remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate narrow nested dependency remediation
        shell: bash
        run: |
          npm pkg set 'overrides.googleapis-common.gaxios=7.3.0'
          npm install --package-lock-only --ignore-scripts
      - name: Verify remediated production dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > phase7-backend-audit-after-fix.json
          code=$?
          cat phase7-backend-audit-after-fix.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lockfile remediation and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-backend-audit-remediation
          path: |
            backend/package-lock.json
            backend/package.json
            backend/phase7-backend-audit-after-fix.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated package remediation
        if: github.event_name == 'push' && steps.audit.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Package files already contain the clean remediation.'
          else
            git commit -m 'Fix backend production dependency audit'
            git push origin HEAD:agent/lms-evaluator-calibration
          fi
      - name: Enforce remediated production dependency audit
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo 'The generated lockfile still contains high-severity production advisories.' >&2
          exit 1
