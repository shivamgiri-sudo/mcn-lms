name: LMS Phase 7 Audit Diagnostics

on:
  push:
    branches: [agent/lms-evaluator-calibration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-phase7-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: Capture backend production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Capture production dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > phase7-backend-audit.json
          code=$?
          cat phase7-backend-audit.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload production audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-backend-audit-diagnostics
          path: backend/phase7-backend-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce production dependency audit
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo 'Production dependency audit failed. Inspect phase7-backend-audit-diagnostics.' >&2
          exit 1
