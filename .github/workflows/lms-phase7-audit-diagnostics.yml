name: LMS Phase 7 Audit Diagnostics

on:
  pull_request:
    branches: [agent/lms-practical-assessments]
  push:
    branches: [agent/lms-evaluator-calibration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-phase7-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-audit:
    name: Generate backend audit remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate lockfile-only remediation
        shell: bash
        run: |
          npm audit fix --omit=dev --package-lock-only --ignore-scripts
      - name: Verify remediated production dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > phase7-backend-audit-after-fix.json
          code=$?
          cat phase7-backend-audit-after-fix.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lockfile remediation and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-backend-audit-remediation
          path: |
            backend/package-lock.json
            backend/package.json
            backend/phase7-backend-audit-after-fix.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce remediated production dependency audit
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo 'The generated lockfile still contains high-severity production advisories.' >&2
          exit 1
