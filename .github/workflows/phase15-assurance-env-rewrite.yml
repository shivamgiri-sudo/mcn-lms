name: Phase 15 Assurance Environment Rewrite

on:
  push:
    branches:
      - agent/lms-secure-browser-sessions
    paths:
      - .github/workflows/phase15-assurance-env-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lms-secure-browser-sessions
          fetch-depth: 0
      - name: Update inherited assurance configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/lms-security-assurance.yml')
          text = path.read_text()

          text = text.replace(
              "      - agent/lms-security-assurance\n  push:\n",
              "      - agent/lms-security-assurance\n      - agent/lms-assessment-intelligence\n  push:\n",
              1,
          )
          text = text.replace(
              "      - agent/lms-assessment-intelligence\n  workflow_dispatch:\n",
              "      - agent/lms-assessment-intelligence\n      - agent/lms-secure-browser-sessions\n  workflow_dispatch:\n",
              1,
          )
          text = text.replace(
              "      SESSION_SECRET: security-assurance-session-secret-longer-than-thirty-two\n      OAUTH_STATE_SECRET:",
              "      SESSION_SECRET: security-assurance-session-secret-longer-than-thirty-two\n      CSRF_SECRET: security-assurance-csrf-secret-longer-than-thirty-two\n      SESSION_FINGERPRINT_SECRET: security-assurance-fingerprint-secret-longer-than-thirty-two\n      HRMS_ASSERTION_SECRET: security-assurance-hrms-assertion-longer-than-thirty-two\n      HRMS_ASSERTION_ISSUER: mcn-hrms-security-ci\n      HRMS_ASSERTION_AUDIENCE: mcn-lms-security-ci\n      OAUTH_STATE_SECRET:",
              1,
          )

          session_line = "            -e SESSION_SECRET=security-assurance-session-secret-longer-than-thirty-two \\\n"
          expanded = session_line + (
              "            -e CSRF_SECRET=security-assurance-csrf-secret-longer-than-thirty-two \\\n"
              "            -e SESSION_FINGERPRINT_SECRET=security-assurance-fingerprint-secret-longer-than-thirty-two \\\n"
              "            -e HRMS_ASSERTION_SECRET=security-assurance-hrms-assertion-longer-than-thirty-two \\\n"
              "            -e HRMS_ASSERTION_ISSUER=mcn-hrms-security-ci \\\n"
              "            -e HRMS_ASSERTION_AUDIENCE=mcn-lms-security-ci \\\n"
              "            -e BRIDGE_ALLOW_LEGACY_SECRET=false \\\n"
          )
          count = text.count(session_line)
          if count != 3:
              raise SystemExit(f'Expected three exact-image session env blocks, found {count}')
          text = text.replace(session_line, expanded)

          path.write_text(text)
          Path('.github/workflows/phase15-assurance-env-rewrite.yml').unlink()
          PY
      - name: Commit assurance update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lms-security-assurance.yml .github/workflows/phase15-assurance-env-rewrite.yml
          git commit -m "Align exact image assurance with secure browser sessions"
          git push origin HEAD:agent/lms-secure-browser-sessions
