name: LMS Security and Build CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lms_ci
          MYSQL_USER: lms_ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://lms_ci:ci-password@127.0.0.1:3306/lms_ci
      SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
      OAUTH_STATE_SECRET: ci-oauth-state-secret-that-is-longer-than-32-characters
      GOOGLE_TOKEN_ENCRYPTION_KEY: ci-google-token-key-that-is-longer-than-32-characters
      FRONTEND_URL: http://localhost:5173
      BRIDGE_SECRET: ci-bridge-secret-that-is-longer-than-32-characters
      HR_API_KEY: ci-hr-api-key-that-is-longer-than-32-characters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply and verify forward-only migrations
        run: |
          npx prisma db execute --file prisma/migrations/20260724090000_secure_password_recovery/migration.sql
          npx prisma db execute --file prisma/migrations/20260724110000_talent_and_permissions_foundation/migration.sql
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          const c = await mysql.createConnection(process.env.DATABASE_URL);
          const expected = [
            'password_reset_tokens',
            'permission_master',
            'role_permission',
            'user_permission_override',
            'skill_master',
            'role_skill_requirement',
            'content_skill_map',
            'assessment_skill_map',
            'employee_skill_profile',
            'skill_evidence',
            'learning_path_master',
            'learning_path_step',
            'learning_path_enrollment',
            'learning_path_step_progress',
          ];
          for (const table of expected) {
            const [rows] = await c.query('SHOW TABLES LIKE ?', [table]);
            if (rows.length !== 1) throw new Error(`${table} was not created`);
          }
          const [resetIndex] = await c.query("SHOW INDEX FROM password_reset_tokens WHERE Key_name='password_reset_tokens_token_hash_key'");
          if (resetIndex.length !== 1) throw new Error('reset token unique index is missing');
          const [permissionCount] = await c.query('SELECT COUNT(*) AS count FROM permission_master');
          if (Number(permissionCount[0].count) < 7) throw new Error('permission seed is incomplete');
          const [roleCount] = await c.query('SELECT COUNT(*) AS count FROM role_permission');
          if (Number(roleCount[0].count) < 10) throw new Error('role permission seed is incomplete');
          await c.end();
          NODE

      - name: Check backend JavaScript syntax
        run: find src prisma test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run security regression tests
        run: npm test

      - name: Capture backend dependency audit
        id: backend_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > audit-report.json

      - name: Upload backend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-audit
          path: backend/audit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce backend dependency audit
        if: steps.backend_audit.outcome == 'failure'
        run: |
          node -e "const a=require('./audit-report.json'); const v=a.vulnerabilities||{}; for (const [name,d] of Object.entries(v)) console.error(name, d.severity, d.range, 'fix:', JSON.stringify(d.fixAvailable)); console.error('metadata:', JSON.stringify(a.metadata?.vulnerabilities||{}));"
          exit 1

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Check frontend JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build frontend
        run: npm run build

      - name: Capture frontend dependency audit
        id: frontend_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high --json > audit-report.json

      - name: Upload frontend audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dependency-audit
          path: frontend/audit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce frontend dependency audit
        if: steps.frontend_audit.outcome == 'failure'
        run: |
          node -e "const a=require('./audit-report.json'); const v=a.vulnerabilities||{}; for (const [name,d] of Object.entries(v)) console.error(name, d.severity, d.range, 'fix:', JSON.stringify(d.fixAvailable)); console.error('metadata:', JSON.stringify(a.metadata?.vulnerabilities||{}));"
          exit 1

  secret-baseline:
    name: Secret regression baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject previously leaked credential patterns in product source
        shell: bash
        run: |
          set -euo pipefail
          pattern='192\.168\.10\.6|qwersdfg|shivam_user'
          matches="$(git grep -nE "$pattern" -- \
            'backend/src/**' \
            'backend/prisma/**' \
            'frontend/src/**' \
            ':!backend/test/**' \
            ':!**/*.lock' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Previously leaked credential or internal-host pattern detected in product source.' >&2
            exit 1
          fi

      - name: Confirm environment files are ignored
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env(\.[A-Za-z0-9_-]+)?\.example$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "$tracked_env_files"
            echo 'Tracked environment files detected.' >&2
            exit 1
          fi
