name: Backend Dependency Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/backend-dependency-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://lms_ci:not-a-real-password@127.0.0.1:3306/lms_ci
      SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate dependency manifest and lockfile
        run: |
          npm install --save \
            adm-zip@^0.6.0 \
            nodemailer@^9.0.3 \
            googleapis@^173.0.0 \
            uuid@^14.0.1 \
            morgan@latest \
            express@^4
          npm audit fix --package-lock-only --omit=dev

      - name: Validate regenerated dependency set
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npm run db:validate
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Commit secure dependency files and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json
          git rm .github/workflows/backend-dependency-refresh.yml
          git commit -m 'Upgrade vulnerable backend dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
