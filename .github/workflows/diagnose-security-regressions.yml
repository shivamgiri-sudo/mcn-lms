name: Diagnose Security Regressions

on:
  pull_request:
    branches:
      - agent/lms-master-hardening
  push:
    branches:
      - agent/lms-security-assurance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-security-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-log:
    name: Capture complete backend test transcript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Run tests and preserve transcript
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/security-regressions.log
      - name: Upload complete transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-security-regression-log
          path: /tmp/security-regressions.log
          if-no-files-found: error
          retention-days: 7
