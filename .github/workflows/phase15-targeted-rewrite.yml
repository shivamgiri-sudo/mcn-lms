name: Phase 15 Targeted Rewrite

on:
  push:
    branches:
      - agent/lms-secure-browser-sessions
    paths:
      - .github/workflows/phase15-targeted-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lms-secure-browser-sessions
          fetch-depth: 0

      - name: Apply exact repository rewrites
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recovery = Path('backend/src/controllers/secureRecovery.js')
          text = recovery.read_text()
          old = "      await tx.portalSession.deleteMany({ where: { userId: token.user_id } });"
          new = """      await tx.$executeRaw`
                UPDATE portal_sessions
                   SET revoked_at = COALESCE(revoked_at, NOW(3)),
                       revoked_reason = COALESCE(revoked_reason, 'Password recovery completed'),
                       elevation_authenticated_at = NULL,
                       elevation_expires_at = NULL,
                       elevation_reason = NULL,
                       updated_at = NOW(3)
                 WHERE user_id = ${token.user_id}
                   AND revoked_at IS NULL
              `;"""
          if old not in text:
              raise SystemExit('Expected secureRecovery session deletion was not found')
          recovery.write_text(text.replace(old, new, 1))

          runbook = Path('docs/RELEASE_CANDIDATE_RUNBOOK.md')
          text = runbook.read_text()
          replacements = {
              'The canonical release chain contains **16 migrations**, beginning with `20260630053213_init` and ending with `20260727120000_assessment_intelligence`.':
              'The canonical release chain contains **17 migrations**, beginning with `20260630053213_init` and ending with `20260729100000_secure_browser_sessions`.',
              '- all 15 migrations against empty MySQL 8 for a clean installation;':
              '- all 17 migrations against empty MySQL 8 for a clean installation;',
              '- Use unique 32+ character values for session, OAuth, bridge, HR API and token-encryption secrets.':
              '- Use independent 32+ character values for session, CSRF, session-fingerprint, OAuth, signed-HRMS-assertion, HR API and token-encryption secrets.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected runbook text was not found: {old}')
              text = text.replace(old, new, 1)
          anchor = '13. PR #16 — governed assessment intelligence and adaptive remediation\n'
          if anchor in text and 'secure browser sessions and identity assurance' not in text:
              text = text.replace(anchor, anchor + '14. Phase 15 stacked release — secure browser sessions and identity assurance\n', 1)
          runbook.write_text(text)

          Path('.github/workflows/phase15-targeted-rewrite.yml').unlink()
          PY

      - name: Commit generated rewrites and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/controllers/secureRecovery.js docs/RELEASE_CANDIDATE_RUNBOOK.md .github/workflows/phase15-targeted-rewrite.yml
          git commit -m "Preserve recovery session evidence and advance runbook"
          git push origin HEAD:agent/lms-secure-browser-sessions
