name: LMS Secret Leak Scan

on:
  pull_request:
    branches:
      - agent/lms-master-hardening
  push:
    branches:
      - agent/lms-security-assurance
  schedule:
    - cron: '45 1 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: lms-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks current-tree scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        run: mkdir -p /tmp/lms-secret-results

      - name: Scan current repository tree
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v /tmp/lms-secret-results:/results \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo \
            --no-banner \
            --redact=100 \
            --report-format sarif \
            --report-path /results/gitleaks.sarif \
            --exit-code 1

      - name: Upload secret scan SARIF
        if: always() && hashFiles('/tmp/lms-secret-results/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/lms-secret-results/gitleaks.sarif
          category: gitleaks-current-tree

      - name: Upload redacted secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-evidence
          path: /tmp/lms-secret-results/gitleaks.sarif
          if-no-files-found: warn
          retention-days: 30
