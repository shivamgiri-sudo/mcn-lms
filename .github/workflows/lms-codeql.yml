name: LMS CodeQL Security Analysis

on:
  pull_request:
    branches:
      - agent/lms-master-hardening
    paths:
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'backend/package*.json'
      - 'frontend/package*.json'
      - '.github/workflows/lms-codeql.yml'
  push:
    branches:
      - agent/lms-security-assurance
      - agent/lms-assessment-intelligence
  schedule:
    - cron: '15 1 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

concurrency:
  group: lms-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: JavaScript and TypeScript security extended
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Build frontend production bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Generate backend Prisma client
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npx prisma generate

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: always
