name: LMS Phase 6 CI

on:
  pull_request:
    branches: [agent/lms-notifications-calendar-feeds]
  push:
    branches: [agent/lms-practical-assessments]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Practical assessment backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lms_ci
          MYSQL_USER: lms_ci
          MYSQL_PASSWORD: lms_ci_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://lms_ci:lms_ci_password@127.0.0.1:3306/lms_ci
      SESSION_SECRET: phase6-session-secret-that-is-longer-than-32-characters
      APP_ENCRYPTION_KEY: phase6-encryption-key-that-is-longer-than-32-characters
      FRONTEND_URL: http://localhost:5173
      LMS_RUN_SCHEDULERS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
      - name: Generate and validate Prisma
        run: |
          npx prisma generate
          npm run db:validate
      - name: Apply all stacked migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            prisma/migrations/20260724090000_secure_password_recovery/migration.sql \
            prisma/migrations/20260724110000_talent_and_permissions_foundation/migration.sql \
            prisma/migrations/20260724140000_coaching_and_certification_lifecycle/migration.sql \
            prisma/migrations/20260724170000_instructor_led_training/migration.sql \
            prisma/migrations/20260724200000_notification_outbox_calendar_feeds/migration.sql \
            prisma/migrations/20260724201000_notification_template_supplement/migration.sql \
            prisma/migrations/20260724230000_practical_assessment_rubrics/migration.sql \
            prisma/migrations/20260724231000_practical_notification_templates/migration.sql
          do
            echo "Applying $migration"
            mysql --show-warnings --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci < "$migration"
          done
      - name: Verify practical assessment schema
        run: |
          mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password -N -e "
            SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='lms_ci'
               AND table_name IN (
                 'practical_assessment_template','practical_rubric_section',
                 'practical_rubric_criterion','practical_assessment_assignment',
                 'practical_assessment_submission','practical_submission_evidence',
                 'practical_evaluation','practical_criterion_score',
                 'practical_moderation_case','practical_assessment_event'
               );
            SELECT COUNT(*) FROM permission_master WHERE permission_key LIKE 'practical.%';
            SELECT COUNT(DISTINCT CONCAT(table_name, ':', index_name))
              FROM information_schema.statistics
             WHERE table_schema='lms_ci' AND non_unique=0
               AND index_name IN (
                 'uq_practical_template_code_version','uq_practical_assignment_attempt',
                 'uq_practical_submission_assignment','uq_practical_evaluator_slot',
                 'uq_practical_evaluator_identity','uq_practical_criterion_score',
                 'uq_practical_moderation_assignment'
               );
            SELECT COUNT(*) FROM information_schema.check_constraints
             WHERE constraint_schema='lms_ci'
               AND constraint_name IN (
                 'chk_practical_template_score','chk_practical_template_evaluators',
                 'chk_practical_section_weight','chk_practical_criterion_score',
                 'chk_practical_critical_min','chk_practical_assignment_status',
                 'chk_practical_evaluation_slot','chk_practical_evaluation_percentage',
                 'chk_practical_moderation_status','chk_practical_moderation_percentage'
               );
            SELECT COUNT(*) FROM notification_template
             WHERE event_type IN (
               'PRACTICAL_ASSIGNED','PRACTICAL_SUBMITTED','PRACTICAL_DUE_REMINDER',
               'PRACTICAL_OVERDUE','PRACTICAL_MODERATION_REQUIRED','PRACTICAL_RESULT'
             );
            SELECT COUNT(DISTINCT event_type) FROM notification_template
             WHERE event_type LIKE 'PRACTICAL_%';
          " lms_ci | tee phase6-schema-check.txt
          test "$(sed -n '1p' phase6-schema-check.txt)" = "10"
          test "$(sed -n '2p' phase6-schema-check.txt)" = "7"
          test "$(sed -n '3p' phase6-schema-check.txt)" = "7"
          test "$(sed -n '4p' phase6-schema-check.txt)" = "10"
          test "$(sed -n '5p' phase6-schema-check.txt)" = "15"
          test "$(sed -n '6p' phase6-schema-check.txt)" = "6"
      - name: Verify assignment evaluator and score guards
        run: |
          mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO skill_master
              (skill_id,skill_code,skill_name,category,level_scale,active,created_by)
            VALUES ('01000000-0000-0000-0000-000000000001','CI-PRACTICAL','CI Practical Skill','Practical',5,1,'ci');
            INSERT INTO practical_assessment_template
              (template_id,template_code,template_name,version_no,passing_pct,max_attempts,
               evaluator_count,blind_evaluation,moderation_threshold_pct,status,active,created_by,published_by,published_at)
            VALUES ('10000000-0000-0000-0000-000000000001','CI-RUBRIC','CI Rubric',1,70,2,2,1,15,'PUBLISHED',1,'ci','ci',UTC_TIMESTAMP(3));
            INSERT INTO practical_rubric_section
              (section_id,template_id,section_code,section_title,sort_order,weight_pct)
            VALUES ('20000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','CORE','Core',1,100);
            INSERT INTO practical_rubric_criterion
              (criterion_id,section_id,criterion_code,criterion_title,sort_order,max_score,
               weight_pct,critical,critical_min_score,evidence_required,skill_id,skill_level_awarded)
            VALUES ('30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001','ACCURACY','Accuracy',1,5,100,1,3,1,'01000000-0000-0000-0000-000000000001',4);
            INSERT INTO practical_assessment_assignment
              (assignment_id,template_id,employee_id,batch_no,attempt_no,status,assigned_by)
            VALUES ('40000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','EMP-CI','BATCH-CI',1,'SUBMITTED','ci');
            INSERT INTO practical_assessment_submission
              (submission_id,assignment_id,status,learner_statement,submitted_by,submitted_at)
            VALUES ('50000000-0000-0000-0000-000000000001','40000000-0000-0000-0000-000000000001','SUBMITTED','CI evidence statement long enough for validation','EMP-CI',UTC_TIMESTAMP(3));
            INSERT INTO practical_evaluation
              (evaluation_id,assignment_id,submission_id,evaluator_id,evaluator_type,evaluator_slot,status)
            VALUES ('60000000-0000-0000-0000-000000000001','40000000-0000-0000-0000-000000000001','50000000-0000-0000-0000-000000000001','EVAL-1','coordinator',1,'DRAFT');
            INSERT INTO practical_criterion_score
              (score_id,evaluation_id,criterion_id,raw_score,weighted_score,critical_fail)
            VALUES ('70000000-0000-0000-0000-000000000001','60000000-0000-0000-0000-000000000001','30000000-0000-0000-0000-000000000001',4,80,0);
          "
          if mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO practical_assessment_assignment
              (assignment_id,template_id,employee_id,attempt_no,status,assigned_by)
            VALUES ('40000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000001','EMP-CI',1,'ASSIGNED','ci');
          "; then
            echo 'Duplicate practical attempt was incorrectly accepted.' >&2
            exit 1
          fi
          if mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO practical_evaluation
              (evaluation_id,assignment_id,submission_id,evaluator_id,evaluator_type,evaluator_slot,status)
            VALUES ('60000000-0000-0000-0000-000000000002','40000000-0000-0000-0000-000000000001','50000000-0000-0000-0000-000000000001','EVAL-2','coordinator',1,'DRAFT');
          "; then
            echo 'Duplicate evaluator slot was incorrectly accepted.' >&2
            exit 1
          fi
          if mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO practical_rubric_section
              (section_id,template_id,section_code,section_title,sort_order,weight_pct)
            VALUES ('20000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000001','INVALID','Invalid',2,0);
          "; then
            echo 'Zero section weight was incorrectly accepted.' >&2
            exit 1
          fi
          if mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO practical_criterion_score
              (score_id,evaluation_id,criterion_id,raw_score,weighted_score,critical_fail)
            VALUES ('70000000-0000-0000-0000-000000000002','60000000-0000-0000-0000-000000000001','30000000-0000-0000-0000-000000000001',-1,0,1);
          "; then
            echo 'Negative criterion score was incorrectly accepted.' >&2
            exit 1
          fi
      - name: Check backend JavaScript syntax
        run: find src prisma test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend regressions with diagnostics
        id: regressions
        shell: bash
        run: |
          set +e
          npm test > phase6-regression.log 2>&1
          code=$?
          cat phase6-regression.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Phase 6 regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase6-regression-diagnostics
          path: backend/phase6-regression.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce backend regressions
        if: steps.regressions.outputs.exit_code != '0'
        run: |
          echo 'Phase 6 regressions failed. Inspect phase6-regression-diagnostics.' >&2
          exit 1
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Phase 6 frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build production frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
