name: LMS Phase 3 CI

on:
  pull_request:
    branches: [agent/world-class-lms-upgrade]
  push:
    branches: [agent/lms-coaching-certification-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-phase3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Coaching and certification backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lms_ci
          MYSQL_USER: lms_ci
          MYSQL_PASSWORD: lms_ci_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://lms_ci:lms_ci_password@127.0.0.1:3306/lms_ci
      SESSION_SECRET: phase3-session-secret-that-is-longer-than-32-characters
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
      - name: Generate and validate Prisma
        run: |
          npx prisma generate
          npm run db:validate
      - name: Apply stacked migrations with diagnostics
        id: stacked_migrations
        shell: bash
        run: |
          set +e
          : > phase3-migration.log
          code=0
          for migration in \
            prisma/migrations/20260724090000_secure_password_recovery/migration.sql \
            prisma/migrations/20260724110000_talent_and_permissions_foundation/migration.sql \
            prisma/migrations/20260724140000_coaching_and_certification_lifecycle/migration.sql
          do
            echo "===== APPLYING $migration =====" | tee -a phase3-migration.log
            mysql --show-warnings --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci \
              < "$migration" >> phase3-migration.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              break
            fi
          done
          cat phase3-migration.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Phase 3 migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-migration-diagnostics
          path: backend/phase3-migration.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce stacked migrations
        if: steps.stacked_migrations.outputs.exit_code != '0'
        run: |
          echo 'Stacked Phase 3 migration failed. Inspect phase3-migration-diagnostics.' >&2
          exit 1
      - name: Verify lifecycle schema and guards
        run: |
          mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password -N -e "
            SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='lms_ci'
               AND table_name IN ('coaching_plan','coaching_goal','coaching_session','coaching_goal_evidence','certification_renewal_rule','employee_certification','certification_renewal_case');
            SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='lms_ci' AND table_name='employee_certification'
               AND column_name='initial_issuance_key' AND generation_expression IS NOT NULL;
            SELECT COUNT(*) FROM information_schema.statistics
             WHERE table_schema='lms_ci' AND table_name='employee_certification'
               AND index_name='uq_cert_initial_issuance' AND non_unique=0;
            SELECT COUNT(*) FROM permission_master WHERE permission_key LIKE 'development.%';
          " lms_ci | tee phase3-schema-check.txt
          test "$(sed -n '1p' phase3-schema-check.txt)" = "7"
          test "$(sed -n '2p' phase3-schema-check.txt)" = "1"
          test "$(sed -n '3p' phase3-schema-check.txt)" = "1"
          test "$(sed -n '4p' phase3-schema-check.txt)" = "6"
      - name: Verify initial issuance uniqueness
        run: |
          mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO employee_certification
              (certification_id,employee_id,certification_type,credential_number,version_no,status,issued_at,issued_by)
            VALUES ('11111111-1111-1111-1111-111111111111','EMP-CI','PROCESS_CERTIFICATION','CI-ONE',1,'ACTIVE',UTC_TIMESTAMP(3),'ci');
          "
          if mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO employee_certification
              (certification_id,employee_id,certification_type,credential_number,version_no,status,issued_at,issued_by)
            VALUES ('22222222-2222-2222-2222-222222222222','EMP-CI','PROCESS_CERTIFICATION','CI-TWO',2,'ACTIVE',UTC_TIMESTAMP(3),'ci');
          "; then
            echo 'Second initial issuance was incorrectly accepted.' >&2
            exit 1
          fi
          mysql --protocol=TCP -h127.0.0.1 -ulms_ci -plms_ci_password lms_ci -e "
            INSERT INTO employee_certification
              (certification_id,employee_id,certification_type,credential_number,version_no,status,issued_at,issued_by,previous_certification_id)
            VALUES ('33333333-3333-3333-3333-333333333333','EMP-CI','PROCESS_CERTIFICATION','CI-RENEWED',2,'ACTIVE',UTC_TIMESTAMP(3),'ci','11111111-1111-1111-1111-111111111111');
          "
      - name: Check backend JavaScript syntax
        run: find src prisma test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend regressions with diagnostics
        id: regression_tests
        shell: bash
        run: |
          set +e
          npm test > phase3-test.log 2>&1
          code=$?
          cat phase3-test.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Phase 3 regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-regression-diagnostics
          path: backend/phase3-test.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce backend regressions
        if: steps.regression_tests.outputs.exit_code != '0'
        run: |
          echo 'Phase 3 regression tests failed. Inspect phase3-regression-diagnostics.' >&2
          exit 1
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Phase 3 frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build production frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
