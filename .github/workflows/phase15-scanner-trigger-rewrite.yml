name: Phase 15 Scanner Trigger Rewrite

on:
  push:
    branches:
      - agent/lms-secure-browser-sessions
    paths:
      - .github/workflows/phase15-scanner-trigger-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lms-secure-browser-sessions
          fetch-depth: 0
      - name: Extend permanent scanner triggers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['lms-codeql.yml', 'lms-secret-scan.yml', 'lms-vulnerability-scan.yml']:
              path = Path('.github/workflows') / name
              text = path.read_text()
              pull_anchor = "      - agent/lms-security-assurance\n"
              if "      - agent/lms-assessment-intelligence\n" not in text.split('  push:', 1)[0]:
                  if pull_anchor not in text:
                      raise SystemExit(f'{name}: pull-request anchor missing')
                  text = text.replace(pull_anchor, pull_anchor + "      - agent/lms-assessment-intelligence\n", 1)
              push_section = text.split('  push:', 1)[1].split('  schedule:', 1)[0]
              if 'agent/lms-secure-browser-sessions' not in push_section:
                  push_anchor = "      - agent/lms-assessment-intelligence\n"
                  if push_anchor not in text:
                      raise SystemExit(f'{name}: push anchor missing')
                  text = text.replace(push_anchor, push_anchor + "      - agent/lms-secure-browser-sessions\n", 1)
              path.write_text(text)
          Path('.github/workflows/phase15-scanner-trigger-rewrite.yml').unlink()
          PY
      - name: Commit scanner triggers and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lms-codeql.yml .github/workflows/lms-secret-scan.yml .github/workflows/lms-vulnerability-scan.yml .github/workflows/phase15-scanner-trigger-rewrite.yml
          git commit -m "Extend security scanners to secure browser sessions"
          git push origin HEAD:agent/lms-secure-browser-sessions
