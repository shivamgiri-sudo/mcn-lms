name: Deploy LMS to Production

# Fires automatically after the main CI workflow passes on main.
# Can also be triggered manually for a hotfix or re-deploy.
on:
  workflow_run:
    workflows: ["LMS Security and Build CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-deploy-production
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LMS_PROD_HOST }}
          username: ${{ secrets.LMS_PROD_USER }}
          password: ${{ secrets.LMS_PROD_SSH_PASS }}
          port: 22
          timeout: 600s
          script: |
            set -euo pipefail
            DEPLOY_DIR=/var/www/mcn-lms
            NODE_BIN=/usr/bin

            echo "==> Pulling latest code"
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing backend dependencies"
            cd "$DEPLOY_DIR/backend"
            "$NODE_BIN/npm" ci --ignore-scripts --omit=dev

            echo "==> Generating Prisma client"
            "$NODE_BIN/npx" prisma generate

            echo "==> Running database migrations"
            "$NODE_BIN/npx" prisma migrate deploy

            echo "==> Building frontend"
            cd "$DEPLOY_DIR/frontend"
            "$NODE_BIN/npm" ci --ignore-scripts
            "$NODE_BIN/npm" run build

            echo "==> Restarting LMS backend via PM2"
            sudo fuser -k 8000/tcp || true
            sleep 1
            "$NODE_BIN/pm2" delete mcn-lms-backend 2>/dev/null || true
            "$NODE_BIN/pm2" start "$DEPLOY_DIR/backend/src/server.js" \
              --name mcn-lms-backend \
              --cwd "$DEPLOY_DIR/backend" \
              --log "$DEPLOY_DIR/backend/lms-out.log" \
              --error "$DEPLOY_DIR/backend/lms-err.log"
            "$NODE_BIN/pm2" save

            echo "==> Waiting for health check"
            for i in $(seq 1 12); do
              if curl --fail --silent --max-time 5 \
                  "http://127.0.0.1:8000/api/runtime/health/ready" \
                  > /dev/null 2>&1; then
                echo "==> Ready after $((i * 5))s"
                break
              fi
              if [[ $i -eq 12 ]]; then
                echo "ERROR: LMS did not become ready within 60s" >&2
                "$NODE_BIN/pm2" logs mcn-lms-backend --lines 30 --nostream
                exit 1
              fi
              sleep 5
            done

            echo "==> Deploy complete"
            "$NODE_BIN/pm2" show mcn-lms-backend

      - name: Deployment summary
        if: always()
        run: |
          echo "## LMS Production Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "| Commit | \`${{ github.event.workflow_run.head_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Triggered by | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
