name: Refresh Phase 14 Release Metadata

on:
  push:
    branches:
      - agent/lms-assessment-intelligence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase14-refresh-release-metadata
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/lms-assessment-intelligence
          fetch-depth: 0
      - name: Advance release contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('deploy/release-manifest.example.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['migrationCount'] = 16
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          test_path = Path('backend/test/release-candidate-regressions.test.js')
          test_content = test_path.read_text()
          replacements = {
              "assert.equal(manifest.migrationCount, 15);": "assert.equal(manifest.migrationCount, 16);",
              "assert.equal(migrations.length, 15);": "assert.equal(migrations.length, 16);",
              "assert.equal(migrations.at(-1), '20260725150000_production_runtime_governance');": "assert.equal(migrations.at(-1), '20260727120000_assessment_intelligence');",
              "assert.match(runbook, /15 migrations/);": "assert.match(runbook, /16 migrations/);",
          }
          for old, new in replacements.items():
              if test_content.count(old) != 1:
                  raise SystemExit(f'Expected one release-test occurrence: {old}')
              test_content = test_content.replace(old, new)
          test_path.write_text(test_content)

          runbook_path = Path('docs/RELEASE_CANDIDATE_RUNBOOK.md')
          runbook = runbook_path.read_text()
          old_order = "11. PR #14 — master release governance, provenance and recovery evidence\n"
          new_order = (
              "11. PR #14 — master release governance, provenance and recovery evidence\n"
              "12. PR #15 — continuous security assurance and protected learning content\n"
              "13. PR #16 — governed assessment intelligence and adaptive remediation\n"
          )
          if runbook.count(old_order) != 1:
              raise SystemExit('Expected one PR #14 order line.')
          runbook = runbook.replace(old_order, new_order)
          old_chain = "The canonical release chain contains **15 migrations**, beginning with `20260630053213_init` and ending with `20260725150000_production_runtime_governance`."
          new_chain = "The canonical release chain contains **16 migrations**, beginning with `20260630053213_init` and ending with `20260727120000_assessment_intelligence`."
          if runbook.count(old_chain) != 1:
              raise SystemExit('Expected one canonical migration sentence.')
          runbook = runbook.replace(old_chain, new_chain)
          runbook_path.write_text(runbook)
          PY

          rm -f .github/workflows/lms-phase14-test-diagnostic.yml
          rm -f .github/workflows/lms-phase14-refresh-release-metadata.yml

      - name: Commit refreshed release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/release-manifest.example.json backend/test/release-candidate-regressions.test.js docs/RELEASE_CANDIDATE_RUNBOOK.md .github/workflows
          git commit -m 'Advance release metadata for Phase 14'
          git push origin HEAD:agent/lms-assessment-intelligence
