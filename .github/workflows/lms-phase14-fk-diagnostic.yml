name: Diagnose Phase 14 Foreign Key

on:
  pull_request:
    branches:
      - agent/lms-security-assurance
    paths:
      - 'backend/prisma/migrations/20260727120000_assessment_intelligence/**'
      - '.github/workflows/lms-phase14-fk-diagnostic.yml'
  push:
    branches:
      - agent/lms-assessment-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: lms_phase14_fk
          MYSQL_USER: lms_ci
          MYSQL_PASSWORD: lms_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://lms_ci:lms_ci_password@127.0.0.1:3306/lms_phase14_fk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install migration runtime
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Apply first fifteen migrations
        run: |
          mv backend/prisma/migrations/20260727120000_assessment_intelligence /tmp/phase14
          cd backend
          npx prisma migrate deploy
      - name: Capture physical schema and isolate first-table failure
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/phase14-fk-diagnostic.log) 2>&1
          ROOT="mysql --protocol=TCP -h127.0.0.1 -uroot -proot_password lms_phase14_fk"

          echo '=== ASSESSMENT MASTER ==='
          $ROOT -e 'SHOW CREATE TABLE assessment_master\G'
          echo '=== COLUMN AND INDEX METADATA ==='
          $ROOT -e "SELECT column_name,column_type,collation_name,is_nullable FROM information_schema.columns WHERE table_schema='lms_phase14_fk' AND table_name='assessment_master' AND column_name='assessment_id';"
          $ROOT -e "SELECT index_name,column_name,sub_part,non_unique FROM information_schema.statistics WHERE table_schema='lms_phase14_fk' AND table_name='assessment_master' AND column_name='assessment_id';"

          echo '=== MINIMAL FK PROBE ==='
          $ROOT --force -e "DROP TABLE IF EXISTS assessment_blueprint_probe_min; CREATE TABLE assessment_blueprint_probe_min (blueprint_id CHAR(36) NOT NULL, assessment_id VARCHAR(191) COLLATE utf8mb4_unicode_ci NOT NULL, PRIMARY KEY (blueprint_id), KEY idx_probe_assessment (assessment_id), CONSTRAINT fk_probe_min FOREIGN KEY (assessment_id) REFERENCES assessment_master(assessment_id) ON DELETE CASCADE) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci; SHOW WARNINGS;"
          echo "minimal_exit=$?"

          echo '=== FULL FIRST-TABLE PROBE ==='
          $ROOT --force -e "DROP TABLE IF EXISTS assessment_blueprint_probe_full; CREATE TABLE assessment_blueprint_probe_full (blueprint_id CHAR(36) NOT NULL, assessment_id VARCHAR(191) NOT NULL, blueprint_name VARCHAR(200) NOT NULL, version_no INT UNSIGNED NOT NULL DEFAULT 1, status VARCHAR(30) NOT NULL DEFAULT 'DRAFT', total_questions INT UNSIGNED NOT NULL, randomize_questions TINYINT(1) NOT NULL DEFAULT 1, randomize_options TINYINT(1) NOT NULL DEFAULT 1, selection_strategy VARCHAR(40) NOT NULL DEFAULT 'SECURE_RANDOM', effective_from DATETIME(3) NULL, effective_to DATETIME(3) NULL, active TINYINT(1) NOT NULL DEFAULT 1, created_by VARCHAR(120) NOT NULL, reviewed_by VARCHAR(120) NULL, reviewed_at DATETIME(3) NULL, published_by VARCHAR(120) NULL, published_at DATETIME(3) NULL, retired_by VARCHAR(120) NULL, retired_at DATETIME(3) NULL, created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3), updated_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3), published_assessment_key VARCHAR(191) GENERATED ALWAYS AS (CASE WHEN status = 'PUBLISHED' AND active = 1 THEN assessment_id ELSE NULL END) STORED, draft_assessment_key VARCHAR(191) GENERATED ALWAYS AS (CASE WHEN status = 'DRAFT' AND active = 1 THEN assessment_id ELSE NULL END) STORED, PRIMARY KEY (blueprint_id), UNIQUE KEY uq_probe_version (assessment_id, version_no), UNIQUE KEY uq_probe_published (published_assessment_key), UNIQUE KEY uq_probe_draft (draft_assessment_key), KEY idx_probe_status (assessment_id, status, active), CONSTRAINT fk_probe_full FOREIGN KEY (assessment_id) REFERENCES assessment_master(assessment_id) ON DELETE CASCADE, CONSTRAINT chk_probe_status CHECK (status IN ('DRAFT','IN_REVIEW','PUBLISHED','RETIRED')), CONSTRAINT chk_probe_questions CHECK (total_questions BETWEEN 1 AND 500), CONSTRAINT chk_probe_dates CHECK (effective_to IS NULL OR effective_from IS NULL OR effective_to > effective_from)) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci; SHOW WARNINGS;"
          echo "full_probe_exit=$?"

          echo '=== APPLY PHASE 14 SQL ==='
          $ROOT --force < /tmp/phase14/migration.sql
          migration_code=$?
          echo "migration_exit=$migration_code"

          echo '=== INNODB STATUS ==='
          $ROOT -e 'SHOW ENGINE INNODB STATUS\G'
          exit "$migration_code"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-fk-diagnostic
          path: /tmp/phase14-fk-diagnostic.log
          if-no-files-found: error
          retention-days: 7
