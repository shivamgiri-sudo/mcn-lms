name: mcn-lms-production

services:
  migrate:
    image: ${LMS_IMAGE}
    env_file:
      - ${LMS_SERVICE_ENV_FILE:-.env.production}
    environment:
      LMS_RUN_MIGRATIONS: "false"
      LMS_RUN_SCHEDULERS: "false"
      LMS_INSTANCE_ROLE: CI
      LMS_INSTANCE_ID: ${DEPLOYMENT_ID:-production}-migrator
      SERVE_FRONTEND: "false"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  app:
    image: ${LMS_IMAGE}
    restart: unless-stopped
    env_file:
      - ${LMS_SERVICE_ENV_FILE:-.env.production}
    environment:
      LMS_RUN_MIGRATIONS: "false"
      LMS_RUN_SCHEDULERS: "false"
      LMS_INSTANCE_ROLE: WEB
      LMS_INSTANCE_ID: ${DEPLOYMENT_ID:-production}-web-1
      SERVE_FRONTEND: "true"
      DRIVE_TOKEN_FILE: runtime/drive-token.enc
      PORT: 4000
    ports:
      - "127.0.0.1:${LMS_HTTP_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/backend/uploads
      - runtime_data:/app/backend/runtime
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:4000/api/runtime/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 30s

  worker:
    image: ${LMS_IMAGE}
    restart: unless-stopped
    env_file:
      - ${LMS_SERVICE_ENV_FILE:-.env.production}
    environment:
      LMS_RUN_MIGRATIONS: "false"
      LMS_RUN_SCHEDULERS: "true"
      LMS_INSTANCE_ROLE: WORKER
      LMS_INSTANCE_ID: ${DEPLOYMENT_ID:-production}-worker-1
      SERVE_FRONTEND: "false"
      DRIVE_TOKEN_FILE: runtime/drive-token.enc
      PORT: 4001
    expose:
      - "4001"
    volumes:
      - uploads_data:/app/backend/uploads
      - runtime_data:/app/backend/runtime
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:4001/api/runtime/health/live >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 45s

volumes:
  uploads_data:
  runtime_data:
